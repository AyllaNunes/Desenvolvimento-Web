<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadrasto com Validação Dinâmica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <form id="form-cadrasto" class="card">
            <h2>Criar conta</h2>

            <div class="grupo-campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required >
            </div>

        <div class="grupo-campo">
            <label for="email">E-mail</label>
            <input type="email" id="email"
            placeholder="Seu@email.com" required>
        </div>

        <div class="grupo-campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <!-- Requisitos dinâmicos da senha-->
             <ul class="lista-requisitos">
                <li id="req-tamanho" class="requisito">Até 8 ou mais caracteres</li>
                <li id="req-maiuscula" class="requisito">Pelo manos uma letra maiúscula</li>
                <li id="req-Numero" class="requisito">Pelo menos um Numero</li>
                <li id="req-especial" class="requisito">Pelo menos um caractere especial (@,#,$,etc.)</li>
             </ul>
        </div>
        <div class="grupo-campo">
        <label for="confirma-senha"></label>
        <input type="password" id="confirmar-senha" placeholder="Repita a senha" required>
        </div>
        <button type="submit" class="btn">Finalizar Cadrasto</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
